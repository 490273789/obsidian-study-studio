name: Draft release

on:
    push:
        tags:
            - "*.*.*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Verify tag and manifest versions
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: node -e "const fs=require('node:fs');const p=require('./package.json');const m=require('./manifest.json');const v=require('./versions.json');if(p.version!==process.env.RELEASE_TAG||m.version!==process.env.RELEASE_TAG||!v[process.env.RELEASE_TAG])process.exit(1)"
            - run: pnpm run check:all
            - run: pnpm build
            - uses: actions/attest-build-provenance@v4
              if: ${{ !github.event.repository.private }}
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
            - name: Create draft GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "${{ github.ref_name }}" main.js manifest.json styles.css --draft --generate-notes --title "${{ github.ref_name }}"
